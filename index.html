<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د. هايدي علي — تسجيل الدخول</title>
<link rel="stylesheet" href="styles.css">
</head>
<body dir="rtl">

<div class="login-wrap">
  <div class="login-card">
    <button class="pill-btn" style="position:absolute; top:20px; inset-inline-end:20px; background:var(--bg); color:var(--rose-deep);" onclick="toggleLang()" id="langBtn">EN</button>

    <div class="crest" id="crest">
      <img src="logo.png" alt="logo" style="width:100%; height:100%; object-fit:cover; border-radius:16px;"
           onerror="this.remove(); document.getElementById('crest').textContent='هع';">
    </div>
    <div class="doctor-title" data-i18n="clinic_name">د. هايدي علي</div>
    <div class="doctor-subtitle" data-i18n="clinic_sub">أخصائية النساء والتوليد والمناظير الجراحية</div>

    <form id="loginForm">
      <div class="field">
        <label data-i18n="email">البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label data-i18n="password">كلمة المرور</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="loginBtn" data-i18n="login_btn">دخول</button>
      <div class="error-msg" id="errorMsg" data-i18n="login_error"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<script src="config.js"></script>
<script>
  applyLang();
  document.getElementById("langBtn").textContent = t("lang_toggle");
  function onLangChange() {
    document.getElementById("langBtn").textContent = t("lang_toggle");
  }

  // لو المستخدم مسجل دخول بالفعل، حوّله على التطبيق مباشرة
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = "app.html";
  })();

  const form = document.getElementById("loginForm");
  const errorMsg = document.getElementById("errorMsg");
  const loginBtn = document.getElementById("loginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.style.display = "none";
    loginBtn.disabled = true;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errorMsg.style.display = "block";
      loginBtn.disabled = false;
      return;
    }
    window.location.href = "app.html";
  });
</script>
</body>
</html>
